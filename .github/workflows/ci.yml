# SPDX-License-Identifier: GPL-2.0-or-later
# Builds the runtime and the launcher and runs every test (docs/LAUNCHER_PLAN.md D15).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Third-party actions are pinned by commit (the tag in the comment); the token can only read.
permissions:
  contents: read
jobs:
  build:
    # arm64 with Rosetta available; the newest image, for the newest Xcode (the code is built with
    # Xcode 27 locally; Xcode 26.3 on macos-15 rejected it).
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Rosetta (x86-64 unit tests)
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: Build tools
        run: |
          brew install cmake ninja pkgconf glslang boost
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Restore x86-64 dependencies
        id: deps
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: macos/deps
          key: deps-${{ runner.os }}-${{ hashFiles('macos/build-deps.sh') }}
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            launcher/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('launcher/Package.swift', 'launcher/Package.resolved') }}
      - run: bash macos/build-deps.sh
      # Saved right away, so a later failing step does not throw the hour of building away.
      - name: Save x86-64 dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: macos/deps
          key: deps-${{ runner.os }}-${{ hashFiles('macos/build-deps.sh') }}
      - run: bash macos/build.sh
      - name: Tests (GPU library, launcher, Python)
        # The runner is a virtual machine: its paravirtual GPU cannot create the Metal device's
        # residency set, so the Metal tests run on real Macs only (macos/test.sh there).
        env:
          BB_TEST_SKIP: '^mtl-'
        run: bash macos/test.sh
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs
          path: macos/out/test-logs
      - name: Launcher app
        run: bash launcher/build.sh --bundle
